# Cloudflare Pages 构建配置

[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "18"

# 开发服务器配置
[dev]
command = "npm run dev"
port = 5173

# 环境变量（示例）
# 在生产环境中，通过 Cloudflare Dashboard 设置 VITE_API_URL
# VITE_API_URL = "https://car-rental-system.your-subdomain.workers.dev/api"
