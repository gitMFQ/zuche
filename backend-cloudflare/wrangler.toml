#:schema node_modules/wrangler/config-schema.json
name = "rental-admin-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库配置
[[d1_databases]]
binding = "DB"
database_name = "rental-admin-db"
database_id = "YOUR_DATABASE_ID_HERE"

# R2 存储桶配置 (用于文件上传)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "rental-admin-uploads"

# 环境变量
[vars]
JWT_SECRET = "your-secret-key-change-in-production"
ENVIRONMENT = "development"

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"

# 生产环境配置
[env.production]
vars = { ENVIRONMENT = "production", JWT_SECRET = "${JWT_SECRET}" }
