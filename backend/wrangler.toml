# Cloudflare Workers 配置文件

name = "car-rental-system"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "car-rental-db"
# database_id = ""  # 运行 wrangler d1 create car-rental-db 后填写

# R2 存储桶绑定（用于文件上传）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "car-rental-uploads"

# 环境变量
[vars]
JWT_SECRET = "your-jwt-secret-change-in-production"
FRONTEND_URL = "https://your-pages-subdomain.pages.dev"

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"

# 生产环境配置
[env.production]
route = { pattern = "https://api.yourdomain.com/*", zone_name = "yourdomain.com" }

[env.production.vars]
JWT_SECRET = "production-jwt-secret-from-secrets"
FRONTEND_URL = "https://car-rental.pages.dev"
