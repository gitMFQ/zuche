name = "cloudflare-rental-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers 部署配置（非 Pages）
pages_deploy = false

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "rental-db"
migrations_dir = "src/db/migrations"

# KV 存储绑定（用于系统设置等）
[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "e7b03e13fa004127b48f51a4a392c549"  # 部署时替换为实际 ID

# R2 存储桶绑定（用于文件上传）
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "rental-uploads"

[vars]
JWT_SECRET = "640111199512100318"
ADMIN_PASSWORD = "admin123"
